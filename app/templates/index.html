<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
    <script defer src="{{ url_for('static', path='/app.js') }}"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark">P</div>
          <div>
            <strong>{{ app_name }}</strong>
            <span>Transcribe + translate</span>
          </div>
        </div>

        <button class="new-chat-button" id="newChatButton" type="button">
          <span aria-hidden="true">+</span>
          New chat
        </button>

        <div class="chat-list" id="chatList" aria-label="Chats"></div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <button class="menu-button" id="menuButton" type="button" aria-label="Open chats">
            <span></span><span></span><span></span>
          </button>
          <div>
            <strong id="activeChatTitle">New chat</strong>
            <span id="statusText">Ready</span>
          </div>
          <button class="theme-button" id="themeButton" type="button" aria-label="Toggle dark mode">
            Dark
          </button>
        </header>

        <section class="messages" id="messageList" aria-live="polite">
          <div class="empty-state" id="emptyState">
            <div class="empty-logo" aria-hidden="true">P</div>
            <div class="empty-signal" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
            <h1 id="emptyGreeting">{{ app_name }}</h1>
            <p id="emptySubtitle">Audio in. Clean words out. Then ask away.</p>
          </div>
        </section>

        <section class="composer-shell" aria-label="Message composer">
          <div class="upload-options">
            <span class="upload-limit">Drop media anywhere or use +. Up to {{ max_upload_mb }} MB.</span>
          </div>
          <div class="attachment-row" id="attachmentRow" hidden></div>

          <form class="composer" id="composer">
            <input
              id="fileInput"
              type="file"
              hidden
              accept="audio/*,video/mp4,video/webm,.mp3,.mp4,.mpeg,.mpga,.m4a,.wav,.webm,.mov,.mkv,.aac,.ogg,.flac"
            >
            <button class="tool-button" id="attachButton" type="button" aria-label="Upload media" title="Upload media">
              +
            </button>
            <textarea
              id="messageInput"
              rows="1"
              maxlength="30000"
              placeholder="Message {{ app_name }}"
            ></textarea>
            <button class="send-button" id="sendButton" type="submit">Send</button>
          </form>
        </section>
      </main>

      <div class="drop-overlay" id="dropOverlay">
        <div>Drop media to transcribe</div>
      </div>
      <div class="source-toast" id="sourceToast" role="status" aria-live="polite">
        No source click, you naughty naught.
      </div>
      <div class="welcome-modal" id="welcomeModal" aria-labelledby="welcomeTitle" role="dialog" aria-modal="true" hidden>
        <form class="welcome-card" id="welcomeForm">
          <div class="welcome-mark">P</div>
          <h2 id="welcomeTitle">Welcome to {{ app_name }}</h2>
          <p>What should I call you?</p>
          <input id="nameInput" name="name" autocomplete="name" maxlength="40" placeholder="Your name">
          <button class="send-button" type="submit">Continue</button>
        </form>
      </div>
    </div>
  </body>
</html>
