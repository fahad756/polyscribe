<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{ app_name }}</title>
    <link rel="icon" href="{{ url_for('static', path='/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
    <script defer src="{{ url_for('static', path='/app.js') }}"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark">P</div>
          <div>
            <strong>{{ app_name }}</strong>
            <span>Transcribe + translate</span>
          </div>
        </div>

        <button class="new-chat-button" id="newChatButton" type="button">
          <span aria-hidden="true">+</span>
          New chat
        </button>

        <div class="chat-list" id="chatList" aria-label="Chats"></div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <button class="menu-button" id="menuButton" type="button" aria-label="Open chats">
            <span></span><span></span><span></span>
          </button>
          <div>
            <strong id="activeChatTitle">New chat</strong>
            <span id="statusText">Ready</span>
          </div>
          <button class="theme-button" id="themeButton" type="button" aria-label="Toggle dark mode" aria-pressed="false">
            <span class="theme-thumb" aria-hidden="true"></span>
            <span class="theme-symbol theme-sun" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M2 12h2M20 12h2M4.9 19.1l1.5-1.5M17.6 6.4l1.5-1.5"></path>
              </svg>
            </span>
            <span class="theme-symbol theme-moon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M20.2 14.4A7.6 7.6 0 0 1 9.6 3.8a8.5 8.5 0 1 0 10.6 10.6Z"></path>
              </svg>
            </span>
          </button>
        </header>

        <section class="messages" id="messageList" aria-live="polite">
          <div class="empty-state" id="emptyState">
            <div class="empty-logo" aria-hidden="true">P</div>
            <h1 id="emptyGreeting">{{ app_name }}</h1>
            <p id="emptySubtitle">Audio in. Clean words out. Then ask away.</p>
          </div>
        </section>

        <section class="composer-shell" aria-label="Message composer">
          <div class="upload-options">
            <span class="upload-limit">Drop media anywhere or use +. Up to {{ max_upload_mb }} MB.</span>
          </div>
          <div class="attachment-row" id="attachmentRow" hidden></div>

          <form class="composer" id="composer">
            <input
              id="fileInput"
              type="file"
              hidden
              accept="audio/*,video/mp4,video/webm,.mp3,.mp4,.mpeg,.mpga,.m4a,.wav,.webm,.mov,.mkv,.aac,.ogg,.flac"
            >
            <div class="composer-tools" id="composerTools">
              <button class="tool-button" id="attachButton" type="button" aria-label="Add media" aria-haspopup="menu" aria-expanded="false">
                +
              </button>
              <div class="attach-menu" id="attachMenu" role="menu" hidden>
                <button class="attach-menu-item" id="uploadOption" type="button" role="menuitem">
                  <span class="attach-menu-icon" aria-hidden="true">U</span>
                  <span>
                    <strong>Upload file</strong>
                    <small>Audio or video</small>
                  </span>
                </button>
                <button class="attach-menu-item" id="recordOption" type="button" role="menuitem">
                  <span class="attach-menu-icon record-dot" aria-hidden="true"></span>
                  <span>
                    <strong id="recordOptionTitle">Listen</strong>
                    <small id="recordOptionMeta">Record from microphone</small>
                  </span>
                </button>
              </div>
            </div>
            <button class="tool-button quick-record-button" id="quickRecordButton" type="button" aria-label="Start listening"></button>
            <textarea
              id="messageInput"
              rows="1"
              maxlength="30000"
              placeholder="Message {{ app_name }}"
            ></textarea>
            <button class="send-button" id="sendButton" type="submit">Send</button>
          </form>
        </section>
      </main>

      <div class="drop-overlay" id="dropOverlay">
        <div>Drop media to transcribe</div>
      </div>
      <div class="source-toast" id="sourceToast" role="status" aria-live="polite">
        No source click, you naughty naught.
      </div>
      <div class="welcome-modal" id="welcomeModal" aria-labelledby="welcomeTitle" role="dialog" aria-modal="true" hidden>
        <form class="welcome-card" id="welcomeForm">
          <div class="welcome-mark">P</div>
          <h2 id="welcomeTitle">Welcome to {{ app_name }}</h2>
          <p>What should I call you?</p>
          <input id="nameInput" name="name" autocomplete="name" maxlength="40" placeholder="Your name">
          <button class="send-button" type="submit">Continue</button>
        </form>
      </div>
    </div>
  </body>
</html>
